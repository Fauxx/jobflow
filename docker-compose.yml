version: '3.8'

services:
  app:
    container_name: jobflow-app
    image: localhost/jobflow_app:latest
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://jobflow:password@db:5432/jobflow
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-jobflow2026}
    volumes:
      - .:/app:z
      - ~/.mozilla:/root/.mozilla:ro
      - ~/.config/google-chrome:/root/.config/google-chrome:ro
    security_opt:
      - label=disable
    depends_on:
      - db
    command: bash -c "sleep 5 && alembic upgrade head && uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir src --reload-dir templates"

  db:
    container_name: jobflow-db
    image: docker.io/library/postgres:16
    environment:
      - POSTGRES_USER=jobflow
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=jobflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
