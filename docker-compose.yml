version: '3.8'

services:
  app:
    build: .
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=sqlite:///./jobflow.db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-jobflow2026}
    volumes:
      - .:/app
    command: uvicorn src.main:app --host 0.0.0.0 --port 8001 --reload
