<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Profile - Jobflow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="/static/css/main.css" rel="stylesheet">
    <script>
        const profileData = {{ profile | tojson | safe }};
    </script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col font-sans">
    <!-- Top Navigation Bar -->
    <header class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="bg-blue-600 p-2 rounded-lg text-white font-bold text-xl">
                <i class="fa-solid fa-user"></i>
            </div>
            <h1 class="text-2xl font-black tracking-tight text-white">Professional Profile</h1>
        </div>
        <div class="flex items-center space-x-4">
            <button onclick="importProfile()" class="bg-green-600 hover:bg-green-500 px-4 py-2 rounded-lg font-bold transition-colors">
                <i class="fas fa-file-import mr-2"></i> Import from resume.json
            </button>
            <a href="/" class="text-gray-400 hover:text-white transition-colors">Back to Dashboard</a>
        </div>
    </header>

    <main class="flex-1 p-6 max-w-6xl mx-auto w-full pb-32">
        <div class="bg-gray-800 rounded-xl border border-gray-700 p-6 shadow-xl mb-6">
            <h2 class="text-xl font-bold mb-4 border-b border-gray-700 pb-2">Identity</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div><label class="block text-sm text-gray-400">Name</label><input type="text" id="p_name" class="w-full bg-gray-700 rounded p-2 text-white" value="{{ profile.get('name', '') }}"></div>
                <div><label class="block text-sm text-gray-400">Title</label><input type="text" id="p_title" class="w-full bg-gray-700 rounded p-2 text-white" value="{{ profile.get('title', '') }}"></div>
                <div><label class="block text-sm text-gray-400">Headline</label><input type="text" id="p_headline" class="w-full bg-gray-700 rounded p-2 text-white" value="{{ profile.get('headline', '') }}"></div>
                <div><label class="block text-sm text-gray-400">Phone</label><input type="text" id="p_phone" class="w-full bg-gray-700 rounded p-2 text-white" value="{{ profile.get('phone', '') }}"></div>
                <div><label class="block text-sm text-gray-400">LinkedIn</label><input type="text" id="p_linkedin" class="w-full bg-gray-700 rounded p-2 text-white" value="{{ profile.get('linkedin_url', '') }}"></div>
                <div><label class="block text-sm text-gray-400">GitHub</label><input type="text" id="p_github" class="w-full bg-gray-700 rounded p-2 text-white" value="{{ profile.get('github_url', '') }}"></div>
                <div><label class="block text-sm text-gray-400">Portfolio</label><input type="text" id="p_portfolio" class="w-full bg-gray-700 rounded p-2 text-white" value="{{ profile.get('portfolio_url', '') }}"></div>
                <div><label class="block text-sm text-gray-400">Location</label><input type="text" id="p_location" class="w-full bg-gray-700 rounded p-2 text-white" value="{{ profile.get('location', '') }}"></div>
            </div>
        </div>

        <!-- Sections -->
        <div class="space-y-6">
            <!-- Experiences -->
            <div class="bg-gray-800 rounded-xl border border-gray-700 p-6 shadow-xl">
                <div class="flex justify-between items-center mb-4 border-b border-gray-700 pb-2">
                    <h3 class="text-lg font-bold text-blue-400"><i class="fas fa-briefcase mr-2"></i> Experience</h3>
                    <button onclick="addExperience()" class="bg-blue-600 hover:bg-blue-500 px-3 py-1 rounded text-sm"><i class="fas fa-plus"></i> Add</button>
                </div>
                <div id="experiences-container" class="space-y-4"></div>
            </div>

            <!-- Projects -->
            <div class="bg-gray-800 rounded-xl border border-gray-700 p-6 shadow-xl">
                <div class="flex justify-between items-center mb-4 border-b border-gray-700 pb-2">
                    <h3 class="text-lg font-bold text-blue-400"><i class="fas fa-project-diagram mr-2"></i> Projects</h3>
                    <button onclick="addProject()" class="bg-blue-600 hover:bg-blue-500 px-3 py-1 rounded text-sm"><i class="fas fa-plus"></i> Add</button>
                </div>
                <div id="projects-container" class="space-y-4"></div>
            </div>

            <!-- Skills -->
            <div class="bg-gray-800 rounded-xl border border-gray-700 p-6 shadow-xl">
                <div class="flex justify-between items-center mb-4 border-b border-gray-700 pb-2">
                    <h3 class="text-lg font-bold text-blue-400"><i class="fas fa-code mr-2"></i> Skills</h3>
                    <button onclick="addSkillCategory()" class="bg-blue-600 hover:bg-blue-500 px-3 py-1 rounded text-sm"><i class="fas fa-plus"></i> Add Category</button>
                </div>
                <div id="skills-container" class="space-y-4"></div>
            </div>

            <!-- Education -->
            <div class="bg-gray-800 rounded-xl border border-gray-700 p-6 shadow-xl">
                <div class="flex justify-between items-center mb-4 border-b border-gray-700 pb-2">
                    <h3 class="text-lg font-bold text-blue-400"><i class="fas fa-graduation-cap mr-2"></i> Education</h3>
                    <button onclick="addEducation()" class="bg-blue-600 hover:bg-blue-500 px-3 py-1 rounded text-sm"><i class="fas fa-plus"></i> Add</button>
                </div>
                <div id="education-container" class="space-y-4"></div>
            </div>
        </div>
    </main>

    <!-- Floating Save Button -->
    <div class="fixed bottom-6 right-6">
        <button onclick="saveProfile()" class="bg-blue-600 hover:bg-blue-500 px-6 py-3 rounded-full font-bold shadow-2xl text-lg flex items-center transition-transform hover:scale-105">
            <i class="fas fa-save mr-2"></i> Save Profile
        </button>
    </div>

    <script>
        function createRemoveBtn(containerId) {
            const btn = document.createElement('button');
            btn.innerHTML = '<i class="fas fa-trash"></i>';
            btn.className = 'absolute top-2 right-2 text-red-500 hover:text-red-400';
            btn.onclick = () => document.getElementById(containerId).remove();
            return btn;
        }

        let expCounter = 0;
        function addExperience(data = null) {
            const id = 'exp_' + expCounter++;
            const div = document.createElement('div');
            div.id = id;
            div.className = 'experience-card relative bg-gray-700 p-4 rounded-lg border border-gray-600';
            
            const bullets = data && data.bullets ? data.bullets.map(b => b.raw_text).join('\n') : '';

            div.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3 pr-8">
                    <div><label class="text-xs text-gray-400">Company</label><input type="text" class="exp-company w-full bg-gray-800 rounded p-1 text-sm" value="${data?.company || ''}"></div>
                    <div><label class="text-xs text-gray-400">Title</label><input type="text" class="exp-title w-full bg-gray-800 rounded p-1 text-sm" value="${data?.title || ''}"></div>
                    <div><label class="text-xs text-gray-400">Location</label><input type="text" class="exp-location w-full bg-gray-800 rounded p-1 text-sm" value="${data?.location || ''}"></div>
                    <div><label class="text-xs text-gray-400">Date Range</label><input type="text" class="exp-date w-full bg-gray-800 rounded p-1 text-sm" value="${data?.end_date || data?.start_date || ''}"></div>
                </div>
                <div>
                    <label class="text-xs text-gray-400">Bullets (One per line)</label>
                    <textarea class="exp-bullets w-full bg-gray-800 rounded p-2 text-sm h-32">${bullets}</textarea>
                </div>
            `;
            div.appendChild(createRemoveBtn(id));
            document.getElementById('experiences-container').appendChild(div);
        }

        let projCounter = 0;
        function addProject(data = null) {
            const id = 'proj_' + projCounter++;
            const div = document.createElement('div');
            div.id = id;
            div.className = 'project-card relative bg-gray-700 p-4 rounded-lg border border-gray-600';
            
            const bullets = data && data.bullets ? data.bullets.map(b => b.raw_text).join('\n') : '';
            const checked = data?.is_highlight ? 'checked' : '';

            div.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3 pr-8">
                    <div><label class="text-xs text-gray-400">Name</label><input type="text" class="proj-name w-full bg-gray-800 rounded p-1 text-sm" value="${data?.name || ''}"></div>
                    <div><label class="text-xs text-gray-400">Role</label><input type="text" class="proj-role w-full bg-gray-800 rounded p-1 text-sm" value="${data?.role || ''}"></div>
                    <div><label class="text-xs text-gray-400">Date Range</label><input type="text" class="proj-date w-full bg-gray-800 rounded p-1 text-sm" value="${data?.date_range || ''}"></div>
                    <div class="flex items-end pb-1"><label class="flex items-center space-x-2 text-sm"><input type="checkbox" class="proj-highlight" ${checked}> <span>Highlight (Main Section)</span></label></div>
                </div>
                <div>
                    <label class="text-xs text-gray-400">Bullets (One per line)</label>
                    <textarea class="proj-bullets w-full bg-gray-800 rounded p-2 text-sm h-32">${bullets}</textarea>
                </div>
            `;
            div.appendChild(createRemoveBtn(id));
            document.getElementById('projects-container').appendChild(div);
        }

        let skillCounter = 0;
        function addSkillCategory(data = null) {
            const id = 'skill_' + skillCounter++;
            const div = document.createElement('div');
            div.id = id;
            div.className = 'skill-card relative bg-gray-700 p-4 rounded-lg border border-gray-600';
            
            const namesStr = data && data.names ? data.names.join('\n') : '';

            div.innerHTML = `
                <div class="mb-3 pr-8">
                    <label class="text-xs text-gray-400">Category</label>
                    <input type="text" class="skill-category w-full bg-gray-800 rounded p-2 text-sm font-bold text-blue-300" value="${data?.category || ''}">
                </div>
                <div>
                    <label class="text-xs text-gray-400">Skills (One per line)</label>
                    <textarea class="skill-names w-full bg-gray-800 rounded p-2 text-sm h-32 leading-relaxed whitespace-pre-wrap">${namesStr}</textarea>
                </div>
            `;
            div.appendChild(createRemoveBtn(id));
            document.getElementById('skills-container').appendChild(div);
        }

        let eduCounter = 0;
        function addEducation(data = null) {
            const id = 'edu_' + eduCounter++;
            const div = document.createElement('div');
            div.id = id;
            div.className = 'edu-card relative bg-gray-700 p-4 rounded-lg border border-gray-600';
            
            div.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pr-8">
                    <div><label class="text-xs text-gray-400">Institution</label><input type="text" class="edu-inst w-full bg-gray-800 rounded p-1 text-sm" value="${data?.institution || ''}"></div>
                    <div><label class="text-xs text-gray-400">Degree</label><input type="text" class="edu-degree w-full bg-gray-800 rounded p-1 text-sm" value="${data?.degree || ''}"></div>
                    <div><label class="text-xs text-gray-400">Location</label><input type="text" class="edu-location w-full bg-gray-800 rounded p-1 text-sm" value="${data?.location || ''}"></div>
                    <div><label class="text-xs text-gray-400">Date</label><input type="text" class="edu-date w-full bg-gray-800 rounded p-1 text-sm" value="${data?.date_str || ''}"></div>
                </div>
            `;
            div.appendChild(createRemoveBtn(id));
            document.getElementById('education-container').appendChild(div);
        }

        // Init Data
        if (profileData) {
            (profileData.experiences || []).forEach(e => addExperience(e));
            (profileData.projects || []).forEach(p => addProject(p));
            
            // Group skills by category
            if (profileData.skills) {
                const grouped = {};
                profileData.skills.forEach(s => {
                    const cat = s.category || 'General';
                    if (!grouped[cat]) grouped[cat] = [];
                    grouped[cat].push(s.name);
                });
                Object.keys(grouped).forEach(cat => {
                    addSkillCategory({ category: cat, names: grouped[cat] });
                });
            }
            
            (profileData.education || []).forEach(ed => addEducation(ed));
        }

        async function importProfile() {
            try {
                const res = await fetch('/profile/import', { method: 'POST' });
                if (res.ok) {
                    window.location.reload();
                } else {
                    alert('Import failed');
                }
            } catch(e) {
                alert('Error: ' + e);
            }
        }

        async function saveProfile() {
            const data = {
                name: document.getElementById('p_name').value,
                title: document.getElementById('p_title').value,
                headline: document.getElementById('p_headline').value,
                phone: document.getElementById('p_phone').value,
                linkedin_url: document.getElementById('p_linkedin').value,
                github_url: document.getElementById('p_github').value,
                portfolio_url: document.getElementById('p_portfolio').value,
                location: document.getElementById('p_location').value,
                experiences: Array.from(document.querySelectorAll('.experience-card')).map(card => ({
                    company: card.querySelector('.exp-company').value,
                    title: card.querySelector('.exp-title').value,
                    location: card.querySelector('.exp-location').value,
                    end_date: card.querySelector('.exp-date').value,
                    bullets: card.querySelector('.exp-bullets').value.split('\\n').filter(b => b.trim() !== '').map(b => ({raw_text: b.trim()}))
                })),
                projects: Array.from(document.querySelectorAll('.project-card')).map(card => ({
                    name: card.querySelector('.proj-name').value,
                    role: card.querySelector('.proj-role').value,
                    date_range: card.querySelector('.proj-date').value,
                    is_highlight: card.querySelector('.proj-highlight').checked,
                    bullets: card.querySelector('.proj-bullets').value.split('\\n').filter(b => b.trim() !== '').map(b => ({raw_text: b.trim()}))
                })),
                skills: (function() {
                    const arr = [];
                    document.querySelectorAll('.skill-card').forEach(card => {
                        const cat = card.querySelector('.skill-category').value.trim();
                        const names = card.querySelector('.skill-names').value.split('\n')
                            .map(s => s.trim())
                            .filter(s => s !== '');
                        names.forEach(n => arr.push({ category: cat, name: n }));
                    });
                    return arr;
                })(),
                education: Array.from(document.querySelectorAll('.edu-card')).map(card => ({
                    institution: card.querySelector('.edu-inst').value,
                    degree: card.querySelector('.edu-degree').value,
                    location: card.querySelector('.edu-location').value,
                    date_str: card.querySelector('.edu-date').value
                }))
            };

            try {
                const res = await fetch('/profile/', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                if (res.ok) {
                    alert('Profile saved successfully!');
                } else {
                    alert('Failed to save profile');
                }
            } catch(e) {
                alert('Error saving profile: ' + e);
            }
        }
    </script>
</body>
</html>
