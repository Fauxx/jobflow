<aside class="w-80 bg-gray-800 border-r border-gray-700 flex flex-col justify-between overflow-y-auto custom-scroll">
    <div class="p-4 space-y-6">
        <!-- Status Navigation -->
        <div class="space-y-1.5">
            <h3 class="text-xs font-bold uppercase tracking-wider text-gray-500 px-2 mb-2">Postings</h3>
            <a href="/?status=NEW" class="flex justify-between items-center px-3 py-2.5 rounded-lg transition {% if current_status == 'NEW' %}bg-blue-650 text-white font-semibold{% else %}text-gray-400 hover:bg-gray-700 hover:text-white{% endif %}">
                <span class="flex items-center space-x-2.5 text-sm">
                    <i class="fa-solid fa-list-check w-4"></i>
                    <span>New Leads</span>
                </span>
                <span class="bg-gray-900 text-xs px-2 py-0.5 rounded-full font-bold text-blue-400">{{ counts.NEW }}</span>
            </a>
            <a href="/?status=APPROVED" class="flex justify-between items-center px-3 py-2.5 rounded-lg transition {% if current_status == 'APPROVED' %}bg-green-650 text-white font-semibold{% else %}text-gray-400 hover:bg-gray-700 hover:text-white{% endif %}">
                <span class="flex items-center space-x-2.5 text-sm">
                    <i class="fa-solid fa-thumbs-up w-4"></i>
                    <span>Approved / Ready</span>
                </span>
                <span class="bg-gray-900 text-xs px-2 py-0.5 rounded-full font-bold text-green-400">{{ counts.APPROVED }}</span>
            </a>
            <a href="/?status=APPLIED" class="flex justify-between items-center px-3 py-2.5 rounded-lg transition {% if current_status == 'APPLIED' %}bg-indigo-650 text-white font-semibold{% else %}text-gray-400 hover:bg-gray-700 hover:text-white{% endif %}">
                <span class="flex items-center space-x-2.5 text-sm">
                    <i class="fa-solid fa-paper-plane w-4"></i>
                    <span>Applied</span>
                </span>
                <span class="bg-gray-900 text-xs px-2 py-0.5 rounded-full font-bold text-indigo-400">{{ counts.APPLIED }}</span>
            </a>
            <a href="/?status=SKIPPED" class="flex justify-between items-center px-3 py-2.5 rounded-lg transition {% if current_status == 'SKIPPED' %}bg-gray-700 text-white font-semibold{% else %}text-gray-400 hover:bg-gray-700 hover:text-white{% endif %}">
                <span class="flex items-center space-x-2.5 text-sm">
                    <i class="fa-solid fa-ban w-4"></i>
                    <span>Skipped</span>
                </span>
                <span class="bg-gray-900 text-xs px-2 py-0.5 rounded-full font-bold text-gray-400">{{ counts.SKIPPED }}</span>
            </a>
        </div>

        <!-- Interactive Scraper Control Panel -->
        <div class="border-t border-gray-700 pt-4">
            <h3 class="text-xs font-bold uppercase tracking-wider text-gray-500 px-2 mb-3">Scraper settings</h3>
            
            <form id="scraper-form" action="/scrape" method="post" class="space-y-4 px-2">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Keywords (Comma-separated)</label>
                    <input type="text" name="keywords" id="scrape-keywords" value="new grad devops, junior devops, junior backend developer" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-xs text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Location</label>
                    <input type="text" name="location" id="scrape-location" value="Philippines" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-xs text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Date Posted</label>
                    <select name="date_range" id="scrape-date" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-xs text-white focus:outline-none focus:border-blue-500">
                        <option value="day">Past 24 Hours</option>
                        <option value="week" selected>Past 3 Days</option>
                        <option value="month">Past Week</option>
                    </select>
                </div>
                
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded text-xs transition duration-150 flex items-center justify-center space-x-1">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <span>Search & Scrape Jobs</span>
                </button>
            </form>
        </div>
    </div>

    <!-- User Profile Snippet -->
    <div class="p-4 border-t border-gray-700 text-xs text-gray-500 bg-gray-850 flex justify-between">
        <span>Profile: {{ resume.name or 'Not set' }}</span>
        <span>v2.0 Clean</span>
    </div>
</aside>
