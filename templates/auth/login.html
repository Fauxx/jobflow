<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jobflow — Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-950 min-h-screen flex items-center justify-center">
    <div class="w-full max-w-sm">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600 rounded-2xl mb-4 shadow-lg">
                <i class="fa-solid fa-briefcase text-white text-2xl"></i>
            </div>
            <h1 class="text-3xl font-black text-white tracking-tight">Jobflow</h1>
            <p class="text-gray-400 text-sm mt-1">Your personal job application assistant</p>
        </div>
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-8 shadow-2xl">
            {% if error %}
            <div class="bg-red-900/50 border border-red-700 text-red-300 text-sm rounded-lg px-4 py-3 mb-5 flex items-center space-x-2">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}
            <form method="POST" action="/auth/login" class="space-y-5">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">Password</label>
                    <input type="password" name="password" autofocus required
                        class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition"
                        placeholder="Enter your password">
                </div>
                <button type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-xl transition flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    <span>Sign In</span>
                </button>
            </form>
        </div>
    </div>
</body>
</html>
